# Use Ghostty's ANSI palette so prompt colors adapt to light and dark mode.
# Light: Monokai Pro Light Sun. Dark: Catppuccin Mocha.
# Keep the existing prompt styles; avoid fixed RGB palettes for either mode.

[directory]
style = "bold cyan"

[git_branch]
style = "bold purple"

[git_status]
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[golang]
disabled = true

[rust]
disabled = false
style = "bold red"

[time]
disabled = false
use_12hr = true
style = "bold yellow"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
